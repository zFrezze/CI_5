# ═══════════════════════════════════════════
#  CyberInfra — Language file (en)
# ═══════════════════════════════════════════

# Shared across multiple commands
general:
  no-permission: "&cYou don't have permission to do that."
  not-enough-tokens: "&cNot enough tokens! You need %price% (you're missing %missing%)."
  invalid-number: "&cInvalid number: %input%"
  player-not-online: "&c%player% is not online or doesn't exist."

language:
  changed: "&aYou have changed the language to %language%."
  invalid: "&cThe language you entered doesn't exist."

# Token system (craft / deposit / /token)
token:
  crafted: "&aYou crafted %amount% Tokens."
  deposited-one: "&aYou have deposited 1 token."
  deposited-many: "&aYou have deposited %amount% Tokens."
  balance: "&aYou have %amount% tokens."
  balance-other: "&a%player% has %amount% tokens."
  usage-invalid: "&cInvalid usage! Use /token info|set|add|remove <player> [amount]"
  usage-sub: "&cUsage: /token %sub% <player> <amount>"
  action-done: "&a%action% done for %player% (%amount%)."

# Withdraw
withdraw:
  usage: "&cUsage: /withdraw <amount>"
  not-positive: "&cAmount must be positive."
  no-space: "&cYou don't have enough tokens or inventory space!"
  success: "&aWithdrew %amount% tokens. Balance: %remaining%"

# Home — teleport (/home)
home:
  usage: "&cInvalid usage! You need to use /home <Home>"
  not-existing: "&c%home% doesn't exist!"
  teleported: "&aSuccessfully teleported to %home%."

# Sethome
sethome:
  usage: "&cInvalid usage! /sethome <name>"
  max-reached: "&cYou have reached the maximum amount of homes!"
  created: "&a%home% successfully created! (-%price% tokens)"

# Removehome
removehome:
  usage: "&cInvalid usage! /removehome <name>"
  removed: "&a%home% successfully removed! (+%price% tokens)"

# Tpa
tpa:
  usage: "&cInvalid usage! /tpa <player>"
  sender-equal-target: "&cYou can't send yourself a TPA request."
  sender-offline: "&cThe player who sent the request is no longer online."
  expire-sender: "&cYour TPA request to %target% has expired."
  expire-target: "&cThe TPA request from %player% has expired."
  success-sender: "&a%target% accepted your TPA request."
  success-target: "&aYou accepted %player%'s TPA request."
  request:
    message: "%prefix% &7%player% has sent you a TPA request."
    accept: "&a&lACCEPT&r &8- &7/&atpaccept"
    deny: "&c&lDENY&r &8- &7/&ctpdeny"
    accept-hover: "&7Click here to accept."
    deny-hover: "&7Click here to deny."
  request-sent:
    message: "%prefix% &7Your TPA request to %target% has been sent."
    cancel: "&c&lCANCEL&r &8- &7/&ctpcancel"
    cancel-hover: "&7Click here to cancel."

# Tpaccept
tpaccept:
  usage: "&cInvalid usage! /tpaccept"
  no-request: "&cYou have no pending TPA request."
  sender-not-enough-tokens: "&c%player% doesn't have enough tokens for the teleport."

# Tpdeny
tpdeny:
  no-request: "&cYou have no pending TPA request."
  denied-target: "&aYou denied the TPA request."
  denied-sender: "&c%target% denied your TPA request."

# Confirm GUI (item names, title, lore)
gui:
  title-set: "&fConfirm to set home &a%home%&f?"
  title-override: "&fConfirm to override home &a%home%&f?"
  title-remove: "&fConfirm to remove home &a%home%&f?"
  title-teleport: "&fTeleport to home &a%home%&f?"
  window-title: "&8Confirmation"
  message-set: "&7You need to pay %price% tokens to set this home."
  message-override: "&7You need to pay %price% tokens to override this home."
  message-remove: "&7You get %price% tokens back for removing this home."
  message-teleport: "&7Confirm home teleportation."
  label-costs: "&fCosts: &a%price%"
  label-refund: "&fRefund: &a%price%"
  confirm: "&aConfirm"
  cancel: "&cCancel"
  world: "&7World: &f%world%"
  coord-x: "&7x: &f%x%"
  coord-y: "&7y: &f%y%"
  coord-z: "&7z: &f%z%"